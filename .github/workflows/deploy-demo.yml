name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan demo statis
        run: |
          mkdir _site
          cp index.html manifest.webmanifest service-worker.js .nojekyll _site/
          cp -R src assets _site/

      - name: Konfigurasi GitHub Pages
        uses: actions/configure-pages@v5

      - name: Unggah artefak Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publikasikan demo
        id: deployment
        uses: actions/deploy-pages@v4
